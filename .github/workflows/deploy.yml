name: Verify application and Worker (no deployment)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested head
        run: |
          mkdir -p work/evidence
          git rev-parse HEAD | tee work/evidence/tested-head.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:assets
      - run: npm run test:api
      - run: npm audit --audit-level=high
      - name: Real Worker and SQLite runtime tests (bounded, offline)
        run: |
          set -o pipefail
          timeout 180s npm run test:runtime 2>&1 | tee work/evidence/runtime.log
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-dist
          path: |
            dist
            work/screenshots
            test-results
            work/evidence
